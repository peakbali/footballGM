# Builds the Google Play app bundle (.aab) for FootballGM with Bubblewrap (Trusted Web Activity).
# Run it from the Actions tab ("Android app bundle" -> Run workflow). Needs two repository secrets:
#   ANDROID_KEYSTORE_B64       base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key use the same one)
# The signed .aab is attached to the run as an artifact. See docs/PLAY_STORE.md.
name: Android app bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (a whole number, +1 for every upload to Play)'
        required: true
        default: '1'
      version_name:
        description: 'Version name shown on the store'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bubblewrap project
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets first (docs/PLAY_STORE.md)"; exit 1; fi
          mkdir -p ~/.bubblewrap build-twa
          # Bubblewrap expects sdkmanager at <sdk>/bin (its own SDK layout); the runner keeps it in cmdline-tools/latest/bin
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -e "$SDK/bin" ] || sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" > /dev/null
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          jq --argjson vc "${{ inputs.version_code }}" --arg vn "${{ inputs.version_name }}" '.appVersionCode=$vc | .appVersionName=$vn | .appVersion=$vn' twa/twa-manifest.json > build-twa/twa-manifest.json
          echo "$KEYSTORE_B64" | base64 -d > build-twa/upload.keystore
          cd build-twa
          yes | npx --yes @bubblewrap/cli@1.27.0 update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build signed bundle
        working-directory: build-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: yes | npx --yes @bubblewrap/cli@1.27.0 build --skipPwaValidation --manifest=./twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: footballgm-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            build-twa/app-release-bundle.aab
            build-twa/app-release-signed.apk
          if-no-files-found: error

  # Installs the signed APK on an emulator, opens it and saves logcat, so a crash on launch is visible
  # without a phone. The log is attached to the run as the "smoke-logcat" artifact.
  smoke:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: footballgm-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r out/app-release-signed.apk
            adb root || true
            adb shell 'echo "_ --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line' || true
            adb shell am set-debug-app --persistent com.android.chrome || true
            adb shell am force-stop com.android.chrome || true
            adb logcat -c || true
            adb shell monkey -p com.peakbali.footballgm -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt || true
            adb shell dumpsys activity activities | grep -i -E "mResumedActivity|topResumedActivity" > top.txt || true
            adb exec-out screencap -p > screen.png || true
            grep -n -A40 "FATAL EXCEPTION" logcat.txt | head -120 || true
            cat top.txt
            ! grep -q "FATAL EXCEPTION" logcat.txt
      - name: Publish screenshot to branch smoke-api${{ matrix.api }}
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s screen.png ] || exit 0
          mkdir pub && cp screen.png pub/ && cp top.txt pub/ 2>/dev/null || true
          cd pub && git init -q && git checkout -q -b smoke-api${{ matrix.api }}
          git -c user.name=smoke -c user.email=smoke@users.noreply.github.com add -A
          git -c user.name=smoke -c user.email=smoke@users.noreply.github.com commit -qm "Smoke test screenshot, API ${{ matrix.api }}, run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:smoke-api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: |
            logcat.txt
            top.txt
            screen.png
          if-no-files-found: warn
