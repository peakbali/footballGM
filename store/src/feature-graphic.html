<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Px; src: url(../../node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
html, body { margin: 0; }
.fg { width: 1024px; height: 500px; position: relative; overflow: hidden; background: #0b1020; font-family: Inter, sans-serif; image-rendering: pixelated; }
.sky { position: absolute; inset: 0 0 150px 0; background: linear-gradient(#0b1020, #141c3a); }
.star { position: absolute; width: 6px; height: 6px; background: #3a4a8a; }
.pitch { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: repeating-linear-gradient(90deg, #238049 0 64px, #2f9a58 64px 128px); }
.pitch::before { content: ''; position: absolute; left: 0; right: 0; top: 34px; height: 12px; background: #e8ecff; }
.light { position: absolute; bottom: 150px; width: 10px; background: #59628f; }
.lamp { position: absolute; width: 72px; height: 36px; background: #e8ecff; border: 4px solid #0b1020; }
.lamp i { position: absolute; inset: 9px 10px; background: #ffcc4d; }
.beam { position: absolute; width: 380px; height: 420px; background: linear-gradient(rgba(255,204,77,.10), rgba(255,204,77,0)); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
.logo { position: absolute; left: 60px; top: 88px; font-family: Px; font-size: 92px; line-height: 0.95; color: #ffcc4d; text-shadow: 6px 6px 0 #6b4a00; letter-spacing: 2px; }
.tag { position: absolute; left: 64px; top: 296px; font-size: 26px; color: #e8ecff; }
.tag b { color: #ffcc4d; }
.ball { position: absolute; right: 120px; top: 70px; width: 300px; height: 300px; }
.phone { position: absolute; right: 70px; bottom: -40px; }
</style></head>
<body><div class="fg">
  <div class="sky"></div>
  <div class="star" style="left:520px;top:40px"></div><div class="star" style="left:600px;top:120px"></div><div class="star" style="left:900px;top:30px"></div><div class="star" style="left:30px;top:30px"></div><div class="star" style="left:440px;top:210px"></div>
  <div class="beam" style="left:620px;top:60px"></div>
    <div class="light" style="left:960px;height:270px"></div><div class="lamp" style="left:929px;top:62px"><i></i></div>
  <div class="pitch"></div>
  <img class="ball" src="ball.png" style="right: 110px; top: 40px; width: 320px; height: 320px; image-rendering: pixelated; filter: drop-shadow(8px 8px 0 rgba(0,0,0,.35));">
  <div class="logo">FOOTBALL<br>GM</div>
  <div class="tag">From the ninth tier <b>to the very top.</b></div>
</div></body></html>
